  return S.acct.devices.map((d,i)=>
    '<div class="dev"><span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg></span>'+
    '<span>'+esc(d[0])+'</span>'+(d[3]?'<span class="cur">当前</span>':'')+
    '<span class="tm">'+(d[3]?'在线':fmtAgo(Date.now()-d[2]))+'</span>'+
    (d[3]?'':'<button onclick="revokeDev('+i+')">移除</button>')+'</div>').join('');
}
function revokeDev(i){
  const n=S.acct.devices[i][0];
  S.acct.devices.splice(i,1);
  document.getElementById('devList').innerHTML=devHtml();
  persist();toast('已移除 '+n);
}
function editProfile(){
  const a=S.acct;
  sheet('编辑资料',
    '<div class="field"><label>昵称</label><input type="text" id="acName" value="'+esc(a.name)+'" maxlength="24"></div>'+
    '<div class="field"><label>邮箱</label><input type="text" id="acMail" value="'+esc(a.email)+'"></div>'+
    '<p class="hint" style="margin:10px 0 14px">更换邮箱后需要在新邮箱里确认一次，确认前仍用旧邮箱登录。</p>'+
    '<div class="btnrow"><button class="btn solid" onclick="saveProfile()">保存</button>'+
    '<button class="btn" onclick="openAccount()">返回</button></div>');
  setTimeout(()=>document.getElementById('acName')?.select(),40);
}
function saveProfile(){
  const n=document.getElementById('acName').value.trim();
  const m=document.getElementById('acMail').value.trim();
  if(!n){toast('昵称不能为空');return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){toast('邮箱格式不太对');return}
  const changed=m!==S.acct.email;
  S.acct.name=n;S.acct.email=m;
  document.getElementById('avaBtn').textContent=initial(n);
  persist();openAccount();
  toast(changed?'已保存，确认邮件已发往新邮箱':'资料已保存');
}
function toggleSync(){
  S.acct.sync=!S.acct.sync;
  document.getElementById('swSync').classList.toggle('on',S.acct.sync);
  document.getElementById('syncS').textContent=S.acct.sync?'上次同步 '+fmtAgo(S.acct.lastSync):'已关闭，片语仅保存在本机';
  persist();toast(S.acct.sync?'已开启云端同步':'已关闭云端同步');
}
function toggle2fa(){
  S.acct.twofa=!S.acct.twofa;
  document.getElementById('sw2fa').classList.toggle('on',S.acct.twofa);
  persist();toast(S.acct.twofa?'两步验证已开启':'两步验证已关闭');
}
function syncNow(quiet){
  closeMenu();
  toast('正在同步…');
  setTimeout(()=>{
    S.acct.lastSync=Date.now();persist();
    const el=document.getElementById('syncS');
    if(el)el.textContent='上次同步 刚刚';
    toast('已同步 '+memos.length+' 条片语');
  },700);
}
function sendReset(){toast('验证邮件已发送到 '+S.acct.email)}
function signOut(){
  closeMenu();
  confirmSheet('退出登录','本机的登录状态会被清除，云端的片语不受影响。',()=>{
    toast('已退出登录（原型中不会真的退出）');
  });
}
function deleteAccount(){
  confirmSheet('注销账号','将永久删除 '+memos.length+' 条片语、全部标签与备份，操作不可撤销。确认前请先导出一份备份。',()=>{
    toast('原型中不执行注销，请先导出备份','导出',exportJson);
  });
}

/* ══ 设置 / 导入导出 ═══════════════════ */
function openSettings(){
  const tags=Object.keys(tagTree());
  sheet('偏好设置',
    '<div class="field"><label>每日目标</label><input type="number" min="1" max="50" id="setGoal" value="'+S.goal+'"></div>'+
    '<div class="field"><label>正文字号</label><input type="range" min="13" max="19" step="0.5" id="setFs" value="'+S.fs+'"><span class="count" id="fsVal">'+S.fs+'px</span></div>'+
    '<div class="field"><label>回顾范围</label><select id="setScope"><option value="all">全部片语</option>'+
      tags.map(t=>'<option value="'+esc(t)+'"'+(S.scope===t?' selected':'')+'>#'+esc(t)+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>默认排序</label><select id="setSort"><option value="new"'+(S.sort==='new'?' selected':'')+'>最新在前</option><option value="old"'+(S.sort==='old'?' selected':'')+'>最早在前</option></select></div>'+
    '<div class="eyebrow" style="padding:0;margin:16px 0 8px">备份</div>'+
    '<div class="btnrow"><button class="btn" onclick="exportMd()">导出 Markdown</button>'+
    '<button class="btn" onclick="exportJson()">导出备份 JSON</button>'+
    '<button class="btn" onclick="document.getElementById(\'imp\').click()">导入备份</button>'+
    '<input type="file" id="imp" accept="application/json" style="display:none"></div>'+
    '<div class="eyebrow" style="padding:0;margin:16px 0 8px">快捷键</div>'+
    '<div style="font-family:var(--mono);font-size:11.5px;color:var(--ink-3);line-height:2">'+
    'Ctrl+Alt+Space 速记浮窗（全局） &nbsp;·&nbsp; Ctrl+Alt+R 本周回顾<br>'+
    'Ctrl+K 命令面板 &nbsp;·&nbsp; Ctrl+N 新片语 &nbsp;·&nbsp; Ctrl+Enter 保存<br>'+
    'Ctrl+B 粗体 &nbsp;·&nbsp; Ctrl+I 斜体 &nbsp;·&nbsp; Ctrl+R 换一条拾遗<br>'+
    'Ctrl+D 深浅外观 &nbsp;·&nbsp; / 聚焦搜索 &nbsp;·&nbsp; Esc 关闭<br>'+
    '编辑器内输入 [[ 引用另一条片语，# 补全标签</div>'+
    '<div class="btnrow" style="margin-top:16px"><button class="btn" onclick="openAccount()">账号设置…</button>'+
    '<button class="btn dang" onclick="resetAll()">恢复示例数据</button></div>');
  const g=document.getElementById('setGoal'),f=document.getElementById('setFs');
  g.oninput=()=>{S.goal=Math.max(1,+g.value||1);drawGoal();persist()};
  f.oninput=()=>{S.fs=+f.value;document.getElementById('fsVal').textContent=S.fs+'px';
    document.documentElement.style.setProperty('--fs',S.fs+'px');persist()};
  document.getElementById('setScope').onchange=e=>{S.scope=e.target.value;rollRecall();drawStats();persist()};
  document.getElementById('setSort').onchange=e=>{S.sort=e.target.value;draw()};
  document.getElementById('imp').onchange=e=>{
    const f2=e.target.files[0];if(!f2)return;
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      if(Array.isArray(d.memos)){memos=d.memos;trash=d.trash||[];TM={...TM,...d.TM};S={...S,...d.S};
        nextId=Math.max(nextId,...memos.map(m=>m.id))+1;closeAll();draw();toast('已导入 '+memos.length+' 条')}
      else toast('文件格式不对')}catch(err){toast('解析失败')}};
    r.readAsText(f2);
  };
}
function download(name,text,type){
  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportMd(){
  const l=memos.slice().sort((a,b)=>b.t-a.t);
  const txt=l.map(m=>{const d=new Date(m.t);
    return '## '+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+
      String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'\n\n'+m.x+'\n';
  }).join('\n---\n\n');
  download('知言导出.md','# 知言\n\n共 '+l.length+' 条\n\n---\n\n'+txt,'text/markdown;charset=utf-8');
  toast('已导出 Markdown');
}
function exportJson(){
  download('知言备份.json',JSON.stringify({memos,trash,S,TM,nextId,at:Date.now()},null,2),'application/json');
  toast('已导出备份');
}
function resetAll(){
  confirmSheet('恢复示例数据','当前所有片语会被示例内容替换，此操作无法撤销。',()=>{
    memos=SEED.map(m=>({...m}));trash=[];TM={pinned:[],closed:[]};nextId=100;
    draw();rollRecall();toast('已恢复示例数据');
  });
}

/* ══ 弹层通用 ══════════════════════════ */
function sheet(title,html){
  document.getElementById('shTitle').textContent=title;
  document.getElementById('shBody').innerHTML=html;
  document.getElementById('scrimPal').classList.remove('show');
  document.getElementById('scrimSheet').classList.add('show');
}
function confirmSheet(title,msg,fn){
  window.__ok=fn;
  sheet(title,'<p style="font-size:13.5px;color:var(--ink-2);line-height:1.7;margin-bottom:16px">'+esc(msg)+'</p>'+
    '<div class="btnrow"><button class="btn solid" onclick="closeAll();window.__ok&&window.__ok()">确定</button>'+
    '<button class="btn" onclick="closeAll()">取消</button></div>');
}
function closeAll(){
  document.getElementById('scrimPal').classList.remove('show');
  document.getElementById('scrimSheet').classList.remove('show');
  menu.classList.remove('show');
  document.getElementById('lightbox').classList.remove('show');
}

/* ══ 命令面板 ══════════════════════════ */
const CMDS=[
  {k:'写新片语',ic:'✎',kb:'Ctrl+N',run:()=>{input.focus();document.getElementById('main').scrollTo({top:0})}},
  {k:'速记浮窗',ic:'▭',kb:'Ctrl+Alt+Space',run:openFloat},
  {k:'本周回顾',ic:'▦',kb:'Ctrl+Alt+R',run:()=>openWeek(0)},
  {k:'上周回顾',ic:'▦',kb:'',run:()=>openWeek(-1)},
  {k:'随机拾遗',ic:'↺',kb:'Ctrl+R',run:rollRecall},
  {k:'切换深浅外观',ic:'◐',kb:'Ctrl+D',run:toggleTheme},
  {k:'只看今日',ic:'◷',kb:'',run:()=>setView('today')},
  {k:'查看全部',ic:'▤',kb:'',run:()=>setView('all')},
  {k:'未归类的片语',ic:'◇',kb:'',run:()=>setView('untagged')},
  {k:'打开回收站',ic:'⌫',kb:'',run:()=>setView('trash')},
  {k:'统计与热力图',ic:'▩',kb:'',run:()=>setTab('stats')},
  {k:'导出 Markdown',ic:'↓',kb:'',run:exportMd},
  {k:'导出备份 JSON',ic:'↓',kb:'',run:exportJson},
  {k:'账号设置',ic:'◉',kb:'',run:openAccount},
  {k:'立即同步',ic:'⇅',kb:'',run:()=>syncNow(true)},
  {k:'偏好设置',ic:'⚙',kb:'',run:openSettings},
];
let pIdx=0,pRows=[];
function openPalette(){
  closeAll();
  document.getElementById('scrimPal').classList.add('show');
  const pq=document.getElementById('pq');pq.value='';fillPalette('');setTimeout(()=>pq.focus(),20);
}
function fillPalette(s){
  const cmds=CMDS.filter(c=>!s||c.k.includes(s)).map(c=>({...c,tx:c.k}));
  const tags=Object.keys(tagTree()).concat(memos.flatMap(m=>parseTags(m.x)))
    .filter((v,i,a)=>a.indexOf(v)===i).filter(t=>!s||t.includes(s)).slice(0,5)
    .map(t=>({tx:'#'+t,ic:'◈',kb:'',run:()=>pickTag(t)}));
  const hits=s?memos.filter(m=>m.x.toLowerCase().includes(s.toLowerCase())).slice(0,6)
    .map(m=>({tx:snippet(m.x,44),ic:'❞',kb:'',run:()=>jumpTo(m.id)})):[];
  pRows=[...cmds,...tags,...hits];pIdx=0;
  document.getElementById('plist').innerHTML=pRows.length
    ?pRows.map((r,i)=>'<button class="pitem '+(i===0?'hl':'')+'" onmouseenter="pHL('+i+')" onclick="pRun('+i+')">'+
      '<span class="ic">'+r.ic+'</span><span class="tx">'+esc(r.tx)+'</span>'+(r.kb?'<span class="kbd">'+r.kb+'</span>':'')+'</button>').join('')
    :'<div style="padding:22px;text-align:center;font-size:13px;color:var(--ink-3)">没有匹配的结果。按 ⏎ 把它写成新片语。</div>';
}
function pHL(i){pIdx=i;document.querySelectorAll('.pitem').forEach((e,j)=>e.classList.toggle('hl',j===i))}
function pRun(i){const r=pRows[i];closeAll();if(r)r.run()}
document.getElementById('pq').addEventListener('input',e=>fillPalette(e.target.value.trim()));
document.getElementById('pq').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();pHL(Math.min(pIdx+1,pRows.length-1))}
  else if(e.key==='ArrowUp'){e.preventDefault();pHL(Math.max(pIdx-1,0))}
  else if(e.key==='Enter'){e.preventDefault();
    if(!pRows.length){const v=e.target.value.trim();closeAll();input.value=v;input.focus();refresh()}
    else pRun(pIdx)}
});

/* ══ 窗口 ══════════════════════════════ */
let maxed=false;
function fakeMax(){
  maxed=!maxed;
  const b=document.getElementById('maxBtn');
  b.title=maxed?'向下还原':'最大化';
  b.innerHTML=maxed
    ?'<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><rect x=".5" y="2.5" width="7" height="7"/><path d="M2.5 2.5V.5h7v7h-2"/></svg>'
    :'<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="9" height="9"/></svg>';
  toast(maxed?'已最大化':'已还原');
}

/* ══ 外观 / 快捷键 ═════════════════════ */
function toggleTheme(){
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';
  S.theme=h.dataset.theme;persist();
}
let toastTimer=null;
function toast(s,actLabel,fn){
  const t=document.getElementById('toast');
  t.innerHTML='<span>'+esc(s)+'</span>';
  if(actLabel){const b=document.createElement('button');b.textContent=actLabel;
    b.onclick=()=>{t.classList.remove('show');fn&&fn()};t.append(b)}
  t.classList.add('show');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),actLabel?4200:1700);
}
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  const typing=['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if(e.ctrlKey&&e.altKey&&(e.code==='Space'||e.key===' ')){e.preventDefault();toggleFloat()}
  else if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='r'){e.preventDefault();openWeek(0)}
  else if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}
  else if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();toggleTheme()}
  else if(mod&&e.key.toLowerCase()==='r'){e.preventDefault();rollRecall();setTab('recall')}
  else if(mod&&e.key.toLowerCase()==='n'){e.preventDefault();input.focus();document.getElementById('main').scrollTo({top:0})}
  else if(e.key==='Escape'){closeAll()}
  else if(e.key==='/'&&!typing){e.preventDefault();document.getElementById('q').focus()}
});

/* ══ 启动 ══════════════════════════════ */
(async()=>{
  await load();
  document.documentElement.dataset.theme=S.theme||'light';
  document.getElementById('avaBtn').textContent=initial(S.acct.name);
  draw();rollRecall();refresh();
})();
</script>
