name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  frontend:
    name: 前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: 不得出现内联事件处理器
        # CSP 是 script-src 'self'（§12.2），onclick 一律不执行。
        # 加回来的话交互会静默失效，而本地开发时看不出来——
        # 「本地好好的、打包后坏掉」最难查，所以在 CI 上钉死。
        run: |
          if grep -rnE '<[a-zA-Z][^>]*\son[a-z]+\s*=' --include='*.html' src/; then
            echo "::error::发现内联事件处理器，它们在 CSP 下不会执行"
            exit 1
          fi

      - name: invoke 只能出现在 store.js 与 platform.js
        # §4.5/§6.1：store.js 是唯一的数据出口。散着调 invoke 迟早会有人
        # 把全量片语拉到前端再 filter，那正是 IPC 边界要挡住的事。
        run: |
          if grep -rn "invoke(" src/js/ --include='*.js' \
             | grep -v '^src/js/store.js:' | grep -v '^src/js/platform.js:'; then
            echo "::error::invoke() 只允许出现在 store.js 与 platform.js 里"
            exit 1
          fi

      - name: 附件地址必须走 zhiyan:// 协议
        # §12.2：绝不能把附件解密成 blob:/data:/file:// 再喂给 <img>。
        # 前两者要先把明文读进 JS 和 DOM，而 DOM 会被 devtools、崩溃转储、
        # 以及「另存为」原样带走；后者直接就是把明文写回磁盘。
        #
        # 只查渲染附件的那两个模块。main.js 里的 createObjectURL 是导出下载用的，
        # 那是明文导出的本分（§9.7），与附件无关。
        run: |
          if grep -rnE "createObjectURL|readAsDataURL|data:image" src/js/render.js src/js/editor.js; then
            echo "::error::附件必须走 zhiyan:// 自定义协议，不能落地成 blob:/data:"
            exit 1
          fi

      - name: 生产构建不得含开发用 mock
        run: |
          if grep -rl "createMock" dist/ 2>/dev/null; then
            echo "::error::mock 与样例数据被打进了生产包"
            exit 1
          fi

  rust:
    name: Rust（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 的 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

      - name: 存储层在真正的 SQLCipher 上也要过
        # 默认 feature 跑的是普通 SQLite，PRAGMA key 会被**静默忽略**——
        # 库照开、数据照写，只是全是明文。所以「开了加密还能不能正常工作」
        # 必须真跑一遍，光 build 过是不够的：
        # zhiyan-db 里那条「加密状态是运行时探测出来的」在这里断言它确实是 true。
        run: cargo test -p zhiyan-db --features sqlcipher

  windows:
    name: Windows 构建烟测
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 发布构建必须开 sqlcipher，不开的话本地库是明文的（§9.2）
      - run: cargo build --manifest-path src-tauri/Cargo.toml --features sqlcipher
