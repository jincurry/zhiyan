name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  frontend:
    name: 前端（零依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 没有 npm install 这一步——前端刻意没有依赖
      - run: node --test "test/**/*.test.js"
        working-directory: ui

      - name: 前端不得出现内联事件处理器
        # CSP 是 script-src 'self'，onclick 一律不执行。
        # 加回来的话交互会静默失效，本地开发时（没有 CSP）却看不出来——
        # 正是这种「本地好好的、打包后坏掉」最难查，所以在 CI 上把它钉死。
        run: |
          if grep -rnE '<[a-zA-Z][^>]*\son[a-z]+\s*=' --include='*.html' ui/; then
            echo "::error::发现内联事件处理器，它们在 CSP 下不会执行"
            exit 1
          fi

  rust:
    name: Rust（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 的 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  windows:
    name: Windows 构建烟测
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 发布构建必须开 sqlcipher，不开的话本地库是明文的（§10.2）
      - run: cargo build -p zhiyan-app --features sqlcipher
