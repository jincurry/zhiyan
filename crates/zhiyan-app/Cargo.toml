[package]
name = "zhiyan-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "知言 · 卡片笔记（Tauri 应用壳与 IPC 命令层）"
default-run = "zhiyan"

[[bin]]
name = "zhiyan"
path = "src/main.rs"

[lib]
name = "zhiyan_app"
# Tauri 的移动端目标需要 cdylib；桌面端只用 rlib，但保留两者以免以后改回来时踩坑
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
zhiyan-core.workspace = true
zhiyan-crypto.workspace = true
zhiyan-store.workspace = true

tauri.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# 发布必须开：本地库整体加密（§10.2）
sqlcipher = ["zhiyan-store/sqlcipher"]
