[package]
name = "zhiyan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "知言 · 卡片笔记"

[[bin]]
name = "zhiyan"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.6"

[dependencies]
zhiyan-crypto.workspace = true
zhiyan-db.workspace = true

tauri = "2.11"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize.workspace = true
hex.workspace = true

# §9.4：DEK 存 Windows Credential Manager
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[target.'cfg(windows)'.dependencies]
# §9.4：存进凭据管理器之前先过一道 DPAPI（用户作用域）
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# 发布必须开：本地库整体加密（§9.2）
sqlcipher = ["zhiyan-db/sqlcipher"]
